name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n ct/itiligent-guacamole.sh
          bash -n install/itiligent-guacamole-install.sh
      - name: Validate PVE Scripts Management metadata and paths
        run: |
          python3 -m json.tool json/itiligent-guacamole.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path("json/itiligent-guacamole.json")
          metadata = json.loads(metadata_path.read_text())

          required = {
              "name",
              "slug",
              "type",
              "updateable",
              "privileged",
              "interface_port",
              "description",
              "install_methods",
          }
          missing = sorted(required - metadata.keys())
          assert not missing, f"Missing metadata fields: {missing}"
          assert metadata["slug"] == "itiligent-guacamole"
          assert metadata["type"] == "ct"

          for method in metadata["install_methods"]:
              script = Path(method["script"])
              assert script.is_file(), f"Missing launcher: {script}"

          install_script = Path("install") / f'{metadata["slug"]}-install.sh'
          assert install_script.is_file(), f"Missing installer: {install_script}"
          PY
      - name: Validate repository rename references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          repo_name = "Proxmox-LXC-Itiligent-Guacamole"
          repo_url = f"https://github.com/ImmacularIT/{repo_name}"
          raw_base = f"https://raw.githubusercontent.com/ImmacularIT/{repo_name}"

          launcher = Path("ct/itiligent-guacamole.sh").read_text()
          readme = Path("README.md").read_text()
          branding = Path("docs/PROXMOX-BRANDING.md").read_text()
          handoff = Path("docs/PROJECT-HANDOFF.md").read_text()
          metadata = json.loads(Path("json/itiligent-guacamole.json").read_text())

          assert f'PROJECT_REPO="{repo_name}"' in launcher
          assert raw_base in readme
          assert repo_url in branding
          assert raw_base in handoff
          assert metadata["documentation"] == repo_url
          assert metadata["repository_url"] == repo_url
          PY
      - name: Validate Proxmox branding assets and launcher hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          png_signature = b"\x89PNG\r\n\x1a\n"
          assets = [
              Path("assets/itiligent-logo.png"),
              Path("assets/itiligent-logo-card.png"),
              Path("assets/immacularit-logo.png"),
          ]
          for asset in assets:
              data = asset.read_bytes()
              assert data.startswith(png_signature), f"Not a valid PNG: {asset}"
              assert len(data) > len(png_signature), f"Empty branding asset: {asset}"

          launcher = Path("ct/itiligent-guacamole.sh").read_text()
          required_markers = [
              "configure_default_identity",
              "configure_default_network",
              "configure_project_tags",
              "set_project_description",
              'asset_base="https://raw.githubusercontent.com/',
              "itiligent-logo-card.png",
              "immacularit-logo.png",
              "Itiligent Easy Guacamole Installer",
              "community-script",
          ]
          for marker in required_markers:
              assert marker in launcher, f"Missing launcher marker: {marker}"
          PY
